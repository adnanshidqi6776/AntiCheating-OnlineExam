<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Online Test Simulator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />

    <style>
      body {
        margin: 0;
        font-family: Arial;
      }

      .container {
        display: flex;
        height: 100vh;
      }

      /* LEFT PANEL */

      .left {
        width: 80px;
        background: #eee;
        padding: 10px;
      }

      .question-btn {
        width: 100%;
        height: 50px;
        font-weight: bold;
      }

      textarea {
        resize: none;
      }

      canvas {
        border: 1px solid black;
      }

      /* WARNING */

      #warning {
        z-index: 9999;
      }
    </style>
  </head>

  <body class="bg-light">
    <!-- Warning Notification -->
    <div
      id="warning"
      class="alert alert-danger position-fixed top-0 start-50 translate-middle-x mt-3 d-none">
      Kecurangan terdeteksi!
    </div>

    <div class="container-fluid vh-100">
      <div class="row h-100">
        <!-- LEFT PANEL -->
        <div class="col-md-2 bg-white border-end p-2">
          <h5 class="text-center mb-3">Pilihan Soal</h5>

          <div
            id="questionButtons"
            class="d-grid gap-2"
            style="grid-template-columns: repeat(4, 1fr)"></div>
        </div>

        <!-- CENTER PANEL -->
        <div class="col-md-7 p-3">
          <div class="card shadow-sm h-100">
            <div class="card-body d-flex flex-column">
              <h5 id="questionText" class="mb-4 fw-bold"></h5>

              <textarea
                id="answerBox"
                class="form-control flex-grow-1"
                placeholder="Tulis jawaban di sini...">
              </textarea>
              <div class="d-flex justify-content-between mt-4">
                <!-- LEFT SIDE -->
                <div>
                  <button
                    class="btn btn-primary me-2"
                    onclick="previousQuestion()">
                    Previous
                  </button>

                  <button class="btn btn-primary" onclick="nextQuestion()">
                    Next
                  </button>
                </div>

                <!-- RIGHT SIDE -->
                <button class="btn btn-danger" onclick="endExam()">END</button>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="col-md-3 bg-white border-start p-3">
          <div class="card-body text-center">
            <!-- Webcam -->
            <canvas
              id="canvas"
              class="w-100 rounded border"
              style="max-height: 300px">
            </canvas>

            <div class="mt-3">
              <h6 class="fw-bold">Tingkat Pelanggaran</h6>

              <!-- Cheating Bar -->
              <div class="progress">
                <div
                  id="progressBar"
                  class="progress-bar bg-danger"
                  style="width: 0%"></div>
              </div>

              <!-- Cheating Counter -->
              <p class="mt-2">
                Pelanggaran:
                <span id="count" class="fw-bold text-danger"> 0 </span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let params = new URLSearchParams(window.location.search);

      let nama = params.get("nama");

      let limit = parseInt(params.get("limit"));

      let count = 0;

      // List of Question
      let questions = [
        "1.	Jelaskan perbedaan antara penelitian eksperimental dan penelitian rekayasa (engineering research).",

        "2.	Dalam sebuah proyek Capstone, bagaimana Anda mengidentifikasi masalah teknis yang layak dijadikan topik penelitian atau pengembangan alat?Jelaskan langkah-langkah analisis masalah tersebut.",

        "3.	Tuliskan contoh rumusan masalah dan tujuan penelitian untuk proyek pengembangan sistem otomatisasi berbasis mikrokontroler.",

        "4.	Dalam tahap perancangan sistem, mengapa penting melakukan kajian pustaka (literature review) terhadap teknologi atau metode yang sudah ada?Jelaskan bagaimana hasil kajian pustaka membantu Anda menentukan solusi desain",

        "5.	Jelaskan metode pengujian (testing) yang relevan untuk menilai performa alat atau sistem yang Anda rancang.Sertakan parameter apa saja yang sebaiknya diukur.",

        "6.	Apa perbedaan antara data primer dan data sekunder dalam penelitian teknik? Jelaskan contoh bagaimana keduanya digunakan dalam proyek Capstone.",

        "7.	Jelaskan perbedaan antara penelitian kualitatif dan kuantitatif, baik dari segi tujuan, data yang digunakan, maupun pendekatan analisisnya.",

        "8.	Dalam penulisan ilmiah, apa perbedaan antara kutipan langsung dan tidak langsung? Jelaskan pula bagaimana cara menuliskannya sesuai kaidah sitasi akademik.",

        "9.	Dalam menyusun rumusan masalah penelitian, apa saja kriteria yang harus diperhatikan agar rumusan tersebut baik dan jelas?",

        "10.	Dalam dokumen Capstone, bagaimana struktur penulisan yang baik untuk Bab III (Metodologi/Perancangan)?Jelaskan komponen penting yang harus dijelaskan di bab tersebut.",
      ];

      let answers = new Array(10).fill("");

      let currentQuestion = 0;

      // CREATE QUESTION BUTTONS

      function createButtons() {
        let container = document.getElementById("questionButtons");

        for (let i = 0; i < 10; i++) {
          let btn = document.createElement("button");

          btn.innerText = i + 1;

          btn.className = "btn btn-outline-success question-btn";

          btn.onclick = () => showQuestion(i);

          container.appendChild(btn);
        }
      }

      createButtons();

      //  Button Update

      function updateButtonStatus() {
        let buttons = document.querySelectorAll(".question-btn");

        buttons.forEach((btn, i) => {
          if (answers[i].trim() !== "") {
            btn.classList.remove("btn-outline-success");
            btn.classList.add("btn-Success");
          } else {
            btn.classList.remove("btn-success");
            btn.classList.add("btn-outline-success");
          }
        });
      }

      function showQuestion(index) {
        // simpan jawaban sebelumnya
        answers[currentQuestion] = document.getElementById("answerBox").value;

        currentQuestion = index;

        document.getElementById("questionText").innerText = questions[index];

        document.getElementById("answerBox").value = answers[index];

        updateButtonStatus();

        updateNavigationButtons();
      }

      showQuestion(0);
      updateButtonStatus();
      updateNavigationButtons();

      // Tombol Previous

      function previousQuestion() {
        if (currentQuestion > 0) {
          showQuestion(currentQuestion - 1);
        }
      }

      // Tombol Next

      function nextQuestion() {
        if (currentQuestion < questions.length - 1) {
          showQuestion(currentQuestion + 1);
        }
      }

      // Disabled Button on First and Last Question
      function updateNavigationButtons() {
        let prevBtn = document.querySelector(
          'button[onclick="previousQuestion()"]',
        );

        let nextBtn = document.querySelector(
          'button[onclick="nextQuestion()"]',
        );

        prevBtn.disabled = currentQuestion === 0;

        nextBtn.disabled = currentQuestion === questions.length - 1;
      }

      // CAMERA

      let canvas = document.getElementById("canvas");

      let ctx = canvas.getContext("2d");

      let video = document.createElement("video");

      let stream;

      async function startCamera() {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: 400,
            height: 300,
          },
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          video.play();

          // SET RESOLUSI CANVAS
          canvas.width = 400;
          canvas.height = 300;
        };

        drawLoop();
      }

      startCamera();

      // DRAW BOXES

      let boxes = [];

      function drawLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // MIRROR VIDEO
        ctx.save();

        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        ctx.restore();

        // DRAW NORMAL
        drawBoxes();

        requestAnimationFrame(drawLoop);
      }

      // DETECTION LOOP

      setInterval(sendFrame, 200); // fps = 5, 100 = 10, 66 = 15, 33 = 60

      function sendFrame() {
        // OFFSCREEN CANVAS
        let tempCanvas = document.createElement("canvas");

        let tempCtx = tempCanvas.getContext("2d");

        tempCanvas.width = video.videoWidth;
        tempCanvas.height = video.videoHeight;

        // DRAW ORIGINAL VIDEO (NO MIRROR)
        tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

        tempCanvas.toBlob(async (blob) => {
          let formData = new FormData();

          formData.append("image", blob);

          formData.append("nama", nama);

          let res = await fetch("/detect", {
            method: "POST",
            body: formData,
          });

          let data = await res.json();

          boxes = data.boxes;

          handleViolation(data);
        });
      }

      // DRAW BOXES

      function drawBoxes() {
        ctx.font = "16px Arial";
        ctx.strokeStyle = "red";
        ctx.lineWidth = 2;
        ctx.fillStyle = "red";

        boxes.forEach((b) => {
          let [x1, y1, x2, y2] = b.bbox;

          let width = x2 - x1;
          let height = y2 - y1;

          // MIRROR BBOX
          let mirroredX = canvas.width - x2;

          ctx.strokeRect(mirroredX, y1, width, height);

          ctx.fillText(b.label + " " + b.confidence, mirroredX, y1 - 5);
        });
      }

      // WARNING

      let warning = document.getElementById("warning");

      function showWarning() {
        warning.classList.remove("d-none");
      }

      function hideWarning() {
        warning.classList.add("d-none");
      }

      // RECORDING

      let mediaRecorder;

      let recordedChunks = [];

      let isRecording = false;

      function startRecording() {
        if (isRecording) return;

        let stream = canvas.captureStream(15); // 15 fps

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: "video/webm",
          videoBitsPerSecond: 1500000,
        });

        recordedChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.start();

        isRecording = true;
      }

      function stopRecording() {
        if (!isRecording) return;

        mediaRecorder.stop();

        mediaRecorder.onstop = async () => {
          let blob = new Blob(recordedChunks, {
            type: "video/webm",
          });

          let formData = new FormData();

          formData.append("video", blob);

          formData.append("nama", nama);

          await fetch("/save_video", {
            method: "POST",
            body: formData,
          });
        };

        isRecording = false;
      }

      // VIOLATION HANDLER

      let lastDetect = false;
      let lastDetectTime = 0;
      let stopDelay = 2000; // 2 detik

      async function handleViolation(data) {
        if (data.detected) {
          showWarning();
          startRecording();

          lastDetectTime = Date.now();

          await fetch("/violation_event", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              nama: nama,
              detected: true,
              confidence: data.confidence,
              label: data.label,
            }),
          });
        } else {
          hideWarning();

          // jangan langsung stop
          if (Date.now() - lastDetectTime > stopDelay) {
            if (isRecording) {
              stopRecording();

              let res = await fetch("/violation_event", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  nama: nama,
                  detected: false,
                  confidence: data.confidence,
                  label: data.label,
                }),
              });

              let result = await res.json();

              if (result.action === "force_end") {
                alert("Ujian dihentikan karena pelanggaran mencapai maksimum");
                endExam();
              }

              if (result.count !== undefined) {
                count = result.count;
                updateProgress();
                setTimeout(resetCooldown, 5000);
              }
            }
          }
        }
      }

      async function resetCooldown() {
        await fetch("/reset_cooldown", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            nama: nama,
          }),
        });
      }

      // Update Progress Bar

      function updateProgress() {
        document.getElementById("count").innerText = count;

        let percent = (count / limit) * 100;

        document.getElementById("progressBar").style.width = percent + "%";
      }

      updateProgress();

      // END EXAM

      async function endExam() {
        answers[currentQuestion] = document.getElementById("answerBox").value;

        await fetch("/save_answers", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            nama: nama,

            answers: answers,
          }),
        });

        stream.getTracks().forEach((track) => track.stop());

        window.location.href = "/";
      }
    </script>

    <!-- Bootstrap JS-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
